<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form id="signin-form">
      <input
        type="email"
        id="email"
        placeholder="Email"
        required
        autocomplete="off"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
        autocomplete="off"
      />

      <button type="submit">Sign In</button>
    </form>

    <script type="module" src="/src/sign-in.js"></script>
  </body>
</html>
